# ─────────────────────────────────────────────
# Bedrock Agent Configuration
# ─────────────────────────────────────────────

# AWS region where your Bedrock resources live
aws.region=us-east-1

# Model ID — Claude 3 Haiku (cheapest capable model)
bedrock.model.id=amazon.nova-pro-v1:0

# Max tokens the model can generate per response
bedrock.max.tokens=1024

# ─────────────────────────────────────────────
# Knowledge Base (Bedrock + S3)
# Set your Knowledge Base ID here after creating
# one in the AWS Console (Bedrock > Knowledge Bases)
# ─────────────────────────────────────────────
bedrock.knowledge.base.id=20U23OKVYM

# Number of results to retrieve from the knowledge base
bedrock.knowledge.base.results=5

# ─────────────────────────────────────────────
# S3 Tool Configuration
# Used by the s3_file_reader tool
# ─────────────────────────────────────────────
s3.default.bucket=YOUR_S3_BUCKET_NAME

# ─────────────────────────────────────────────
# Bedrock Guardrails (optional)
# Create a guardrail in the AWS Console:
#   Bedrock → Guardrails → Create guardrail
# Then paste the Guardrail ID and version below.
# Leave as YOUR_GUARDRAIL_ID to disable.
# ─────────────────────────────────────────────
bedrock.guardrail.id=a5cpagtruve7
bedrock.guardrail.version=DRAFT

# ─────────────────────────────────────────────
# Agent System Prompt
# ─────────────────────────────────────────────
agent.system.prompt=You are a helpful AI assistant with access to tools and a knowledge base. \
  Use the knowledge base to answer questions about documents stored in S3. \
  Use tools when you need to perform calculations, check the time, or read specific files. \
  Always be concise and accurate.
